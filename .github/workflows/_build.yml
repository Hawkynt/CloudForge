name: Build artifacts

# Shared build/pack block. Called by release.yml (manual dispatch) and
# nightly.yml (auto, on CI success). Single place that turns a commit into
# shippable artifacts so release and nightly never diverge.
#
# CloudForge is a plain Node CLI with no package manifest, so there is nothing
# to compile or pack per-package -- the shippable artifact is a zip of the tool
# itself (entry script, launcher, libraries, prompts, license, readme).
# `version.pl --stamp` stays in place for uniformity with the repo family; it
# is a no-op while no manifest exists and starts stamping the moment one is
# added.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref/SHA to build (defaults to caller ref)
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0                           # version.pl counts commits

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stamp per-package versions
        shell: bash
        run: perl .github/workflows/scripts/version.pl --stamp

      - name: Package application
        shell: bash
        run: |
          mkdir -p dist
          zip -r dist/CloudForge.zip forge.js forge.bat lib prompts LICENSE README.md

      - uses: actions/upload-artifact@v4
        with:
          name: app-artifacts
          path: dist/*
          if-no-files-found: error
